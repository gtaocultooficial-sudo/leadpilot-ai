<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · LeadPilot AI</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="container"><section class="panel" style="max-width:460px;margin:12vh auto"><p class="eyebrow">ACESSO RESTRITO</p><h1>Entrar no LeadPilot AI</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Usuário<input name="username" autocomplete="username" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="button">Entrar</button></form></section></main></body></html>
