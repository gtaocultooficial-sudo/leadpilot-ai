{% extends "base.html" %}{% block title %}{{ heading }} · LeadPilot AI{% endblock %}
{% block content %}<section class="page-head"><div><p class="eyebrow">CADASTRO COMERCIAL</p><h1>{{ heading }}</h1><p class="muted">Registre apenas informações pertinentes e a fonte de onde vieram.</p></div></section>
<form class="panel form-grid" method="post"><label>Empresa *<input name="company" required value="{{ lead.get('company','') }}"></label><label>Nome do contato<input name="contact_name" value="{{ lead.get('contact_name','') }}"></label><label>E-mail comercial<input name="email" type="email" value="{{ lead.get('email','') }}"></label><label>Telefone comercial<input name="phone" value="{{ lead.get('phone','') }}"></label><label>Site<input name="website" type="url" placeholder="https://" value="{{ lead.get('website','') }}"></label><label>Segmento<input name="segment" value="{{ lead.get('segment','') }}" placeholder="Ex.: barbearia"></label><label>Cidade/região<input name="city" value="{{ lead.get('city','') }}"></label><label>Fonte do lead<input name="source" value="{{ lead.get('source','') }}" placeholder="Ex.: site público, indicação"></label><label class="wide">Necessidade / oportunidade observada<textarea name="need" rows="2">{{ lead.get('need','') }}</textarea></label><label class="wide">Notas internas<textarea name="notes" rows="3">{{ lead.get('notes','') }}</textarea></label><label>Base/observação de contato<input name="consent_basis" value="{{ lead.get('consent_basis','') }}" placeholder="Ex.: canal comercial público"></label>{% if lead.get('id') %}<label>Status<select name="status">{% for s in statuses %}<option {% if lead.get('status')==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>{% endif %}<div class="wide form-actions"><button class="button">Salvar lead</button><a class="button ghost" href="{{ url_for('leads') }}">Cancelar</a></div></form>{% endblock %}
